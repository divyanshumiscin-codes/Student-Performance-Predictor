{% extends "base.html" %}
{% block title %}Predict{% endblock %}
{% block content %}
<h2>Student Performance Prediction</h2>
{% if errors %}
<div class="alert alert-danger">
    <ul class="mb-0">
    {% for error in errors %}
        <li>{{ error }}</li>
    {% endfor %}
    </ul>
</div>
{% endif %}
<form method="POST" action="/predict">
    <div class="mb-3">
        <label class="form-label">Student Name</label>
        <input type="text" name="student_name" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Subject</label>
        <select name="subject" class="form-select" required>
            <option value="0">Math</option>
            <option value="1">Language</option>
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Study Hours (weekly, scale 1-4)</label>
        <input type="number" name="study_hours" class="form-control" min="1" max="4" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Attendance Issues (number of absences)</label>
        <input type="number" name="attendance_issues" class="form-control" min="0" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Past Failures</label>
        <input type="number" name="past_failures" class="form-control" min="0" max="4" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Previous Marks 1 (out of 20)</label>
        <input type="number" name="previous_marks_1" class="form-control" min="0" max="20" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Previous Marks 2 (out of 20)</label>
        <input type="number" name="previous_marks_2" class="form-control" min="0" max="20" required>
    </div>
    <button type="submit" class="btn btn-primary">Predict</button>
</form>
{% endblock %}
