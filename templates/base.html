<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Student Performance Predictor{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container d-flex justify-content-between">
        <span class="navbar-brand">Student Performance Predictor</span>
        {% if session.get('role') %}
        <span class="text-light">
            Logged in as: <strong>{{ session.get('role').capitalize() }}</strong>
            {% if session.get('role') == 'teacher' %}
|           <a href="{{ url_for('history') }}" class="text-light">History</a>
|           <a href="{{ url_for('bulk_upload') }}" class="text-light">Bulk Upload</a>
            {% endif %}
            | <a href="{{ url_for('logout_role') }}" class="text-warning">Switch Role</a>
        </span>
        {% endif %}
    </div>
</nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
